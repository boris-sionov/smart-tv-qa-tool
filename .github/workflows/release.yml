name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

# Attaching the bundles edits the release, which the repo's default read-only token refuses (403).
permissions:
  contents: write

env:
  NODE_VERSION: '20.x'
  # Compiled into the app for Firebase App Distribution sign-in; empty leaves it switched off.
  FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
  FIREBASE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_OAUTH_CLIENT_SECRET }}

jobs:
  release:
    name: Build & Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: windows-arm64
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Required Packages (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 gir1.2-webkit2-4.1=2.44.0-2 xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Download ADB binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries
          bash scripts/download-adb.sh

      - name: Download ADB binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/download-adb.ps1

      - name: Download SDB binary (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          mkdir -p src-tauri/binaries
          bash scripts/download-sdb.sh

      - name: Download SDB binary (macOS universal)
        if: matrix.target == 'macos'
        run: |
          mkdir -p src-tauri/binaries
          bash scripts/download-sdb.sh
          # A universal build compiles once per arch and bundles under the universal name, and each
          # looks up the sidecar by its own triple. platform-tools' adb is universal; Samsung's sdb is
          # Intel-only and runs under Rosetta, so the same file serves every name.
          for bin in adb sdb; do
            for triple in x86_64-apple-darwin universal-apple-darwin; do
              cp src-tauri/binaries/$bin-aarch64-apple-darwin src-tauri/binaries/$bin-$triple
            done
          done

      - name: Download SDB binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/download-sdb.ps1

      - name: Copy binaries for ARM64 cross-compile (Windows)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          Copy-Item src-tauri\binaries\adb-x86_64-pc-windows-msvc.exe `
                    src-tauri\binaries\adb-aarch64-pc-windows-msvc.exe
          Copy-Item src-tauri\binaries\sdb-x86_64-pc-windows-msvc.exe `
                    src-tauri\binaries\sdb-aarch64-pc-windows-msvc.exe

      - name: Copy binaries for the 32-bit build (Windows x64)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          Copy-Item src-tauri\binaries\adb-x86_64-pc-windows-msvc.exe `
                    src-tauri\binaries\adb-i686-pc-windows-msvc.exe
          Copy-Item src-tauri\binaries\sdb-x86_64-pc-windows-msvc.exe `
                    src-tauri\binaries\sdb-i686-pc-windows-msvc.exe

      - name: Build (Windows x64)
        if: matrix.target == 'windows-x64'
        run: |
          rustup target add i686-pc-windows-msvc
          npm run build -- --features=vendored-openssl --target x86_64-pc-windows-msvc
          npm run build -- --features=vendored-openssl --target i686-pc-windows-msvc

      - name: Build (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        run: |
          rustup target add aarch64-pc-windows-msvc
          npm run build -- --features=vendored-openssl --target aarch64-pc-windows-msvc

      - name: Build (Linux)
        if: startsWith(matrix.target, 'linux')
        run: npm run build -- --features=vendored-openssl

      - name: Build (macOS)
        if: matrix.target == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          npm run build -- --features=vendored-openssl --target universal-apple-darwin
        env:
          CI: true

      # Tauri names bundles by arch alone (x64, amd64, universal), so say the OS too.
      - name: Name Installers By Platform
        shell: bash
        run: |
          shopt -s globstar nullglob
          version=$(node -p "require('./package.json').version")
          mkdir -p release-files
          for f in target/**/bundle/{deb,rpm,appimage,msi,nsis,dmg}/*.{deb,rpm,AppImage,msi,exe,dmg}; do
            name=$(basename "$f")
            case "$name" in
              *universal*)                  platform=macos-intel-and-apple-silicon ;;
              *_x64_*|*_x64-setup*)         platform=windows-x64 ;;
              *_x86_*|*_x86-setup*)         platform=windows-32bit ;;
              *_arm64_*.msi|*_arm64-setup*) platform=windows-arm64 ;;
              *amd64*|*x86_64*)             platform=linux-x86_64 ;;
              *arm64*|*aarch64*)            platform=linux-arm64 ;;
              *) echo "No platform for $name" >&2; exit 1 ;;
            esac
            case "$name" in
              *.exe) suffix=-setup.exe ;;
              *)     suffix=.${name##*.} ;;
            esac
            cp "$f" "release-files/QA-Tool_${version}_${platform}${suffix}"
          done
          ls -l release-files

      - name: Upload Artifact (snapshot)
        uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: ${{ matrix.target }}-package
          path: release-files/*

      - name: Attach to Release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'release'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "release-files/*"
