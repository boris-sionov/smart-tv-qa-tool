name: Build Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build (${{ matrix.os }}${{ matrix.rust-target && format(' · {0}', matrix.rust-target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-latest
          - os: windows-latest
          - os: windows-latest
            rust-target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Required Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 gir1.2-webkit2-4.1=2.44.0-2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (ARM64)
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Download ADB binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries
          bash scripts/download-adb.sh

      - name: Download ADB binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/download-adb.ps1

      - name: Download SDB binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/binaries
          bash scripts/download-sdb.sh

      - name: Download SDB binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/download-sdb.ps1

      - name: Build
        run: npm run build -- --features=vendored-openssl${{ matrix.rust-target && format(' --target {0}', matrix.rust-target) || '' }}
