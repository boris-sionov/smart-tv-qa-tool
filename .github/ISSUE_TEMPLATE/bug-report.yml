name: Bug Report
description: Something within the app is not working as expected
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Your Computer
        Please provide information about the machine running **Smart TV QA Tool**.
  - type: dropdown
    attributes:
      label: Operating System
      options:
        - 'macOS'
        - 'Windows'
        - 'Linux'
    validations:
      required: true
  - type: input
    attributes:
      label: Smart TV QA Tool Version
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## TV Device
        Which TV platform is affected?
  - type: dropdown
    attributes:
      label: Platform
      options:
        - 'Samsung Tizen'
        - 'Android TV'
        - 'LG WebOS'
        - 'Other / Not platform-specific'
    validations:
      required: true
  - type: input
    attributes:
      label: TV Model / Firmware Version
      placeholder: "Example: Samsung QE55Q80C, Tizen 7.0"

  - type: markdown
    attributes:
      value: |
        ## Issue
  - type: textarea
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: "Example: Clicking Install WGT shows an error after the 'Connecting with SDB' step."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the app
        2. Select Samsung Tizen
        3. Click Install WGT
        4. ...
  - type: textarea
    attributes:
      label: Additional Context
      description: Logs, screenshots, or anything else that might help.
