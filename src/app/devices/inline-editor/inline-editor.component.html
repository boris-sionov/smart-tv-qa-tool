<div class="editor-wrapper">
  <app-device-editor [name]="device.name" [username]="device.username" [auth]="deviceAuth"
                     [port]="device.port" [host]="device.host" [description]="device.description"
                     #deviceEditor>
  </app-device-editor>

  <div class="editor-actions">
    <button class="editor-btn danger" (click)="$event.stopPropagation(); remove.emit(device)">
      <i class="bi bi-trash"></i>
      Delete
    </button>
    <div class="editor-actions-right">
      <button class="editor-btn secondary" (click)="$event.stopPropagation(); closed.emit()">
        <i class="bi bi-x-lg"></i>
        Cancel
      </button>
      <button class="editor-btn primary" (click)="$event.stopPropagation(); doSave(deviceEditor)"
              [disabled]="!deviceEditor.valid">
        <i class="bi bi-check-lg"></i>
        Save
      </button>
    </div>
  </div>
</div>
